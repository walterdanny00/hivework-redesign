<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hivework: rounds switcher mockup</title>
<style>
  :root{
    color-scheme: dark;
    --bg:#111111; --card:#191918; --line:#2b2b28; --ink:#f1efe9; --ink-soft:#a3a099;
    --paper:#292926; --paper-raised:#32322e; --paper-line:#3d3d38; --f-ink:#efede6; --f-soft:#a3a099;
    --teal:#3fd6c3; --violet:#8f7ff7; --amber:#e6b450; --amber-tint:#2e2616; --note:#1c1b17;
  }
  @media (prefers-color-scheme: light){
    :root{
      color-scheme: light;
      --bg:#f2f1ed; --card:#fbfbf9; --line:#d9d8d1; --ink:#1c1f1d; --ink-soft:#5c645e;
      --paper:#eaebe6; --paper-raised:#f5f5f1; --paper-line:#cdd0c7; --f-ink:#1c1f1d; --f-soft:#5c645e;
      --teal:#0f8f80; --violet:#6a58e0; --amber:#9a6a00; --amber-tint:#fbf1da; --note:#f1f0ea;
    }
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:1.5;}
  .wrap{max-width:430px;margin:0 auto;padding:16px 14px 48px;}
  button{font-family:inherit;color:inherit;}
  button:focus-visible{outline:2px solid var(--violet);outline-offset:2px;}

  /* mockup chrome, not part of the app */
  .mode{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:100px;padding:4px;margin-bottom:6px;}
  .mode button{flex:1;border:none;background:none;border-radius:100px;padding:9px 10px;font-size:12px;font-weight:700;color:var(--ink-soft);cursor:pointer;}
  .mode button[aria-pressed="true"]{background:var(--ink);color:var(--bg);}
  .mode-tag{font-size:11.5px;color:var(--ink-soft);margin:0 4px 16px;min-height:17px;}

  /* ledger card */
  .slot{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px 14px 16px;}
  .who{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
  .av{width:44px;height:44px;border-radius:50%;background:#f3c04a;color:#3a2c00;display:grid;place-items:center;font-weight:800;}
  .who .n{font-weight:700;font-size:16px;}
  .who .s{font-size:12px;color:#e0b341;}
  .who .chip{margin-left:auto;font-size:11.5px;font-weight:700;color:#e0b341;background:#2f2715;border-radius:100px;padding:7px 12px;}
  @media (prefers-color-scheme: light){.who .chip{background:#fbefc8;color:#8a6200}.who .s{color:#8a6200}}

  /* switcher tabs */
  .tabs{display:flex;gap:6px;margin-bottom:10px;}
  .tab{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:none;border-radius:10px;padding:10px 6px;font-size:12.5px;font-weight:700;color:var(--ink-soft);cursor:pointer;}
  .tab[aria-selected="true"]{background:var(--paper-raised);color:var(--ink);border-color:var(--paper-line);}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--teal);}
  .viewing{display:flex;align-items:center;gap:10px;background:var(--amber-tint);border:1px solid var(--amber);border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:12.5px;}
  .viewing b{color:var(--amber);}
  .viewing button{margin-left:auto;white-space:nowrap;border:1px solid var(--amber);background:none;border-radius:100px;padding:6px 11px;font-size:11.5px;font-weight:700;color:var(--amber);cursor:pointer;}
  .fb{font-size:12.5px;color:var(--ink-soft);background:var(--note);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px;}
  .fb b{color:var(--ink);}
  .fb .when{display:block;font-size:11px;margin-top:2px;}

  /* report paper, same structure as SubmissionReport */
  .report{background:var(--paper);border:1px solid var(--paper-line);color:var(--f-ink);overflow:hidden;margin-top:2px;}
  .rh{display:flex;justify-content:space-between;align-items:flex-start;padding:16px 18px;border-bottom:1px solid var(--paper-line);}
  .cid{font-family:ui-monospace,"JetBrains Mono",monospace;font-size:10px;color:var(--f-soft);letter-spacing:.02em;}
  .stamp{font-size:10.5px;font-weight:700;color:var(--stamp,var(--teal));border:1.5px solid var(--stamp,var(--teal));border-radius:3px;padding:4px 8px;transform:rotate(-2deg);}
  .report.old{--stamp:var(--f-soft);}
  .secs{padding:16px 18px 4px;}
  .sec{margin-bottom:16px;}
  .sl{font-weight:700;font-size:11px;color:var(--f-soft);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px;}
  .sec.primary .sl{color:var(--stamp,var(--teal));}
  .sec p{margin:0;font-size:13px;line-height:1.6;}
  .hr{border:none;border-top:1px solid var(--paper-line);margin:0 0 16px;}
  .fig{margin:8px 0 2px;}
  .fig-img{height:92px;max-width:300px;border:1px solid var(--paper-line);border-radius:2px;background:repeating-linear-gradient(135deg,var(--paper-raised) 0 8px,var(--paper) 8px 16px);display:grid;place-items:center;font-size:11px;color:var(--f-soft);}
  .fig-cap{font-size:11.5px;color:var(--f-soft);margin-top:6px;border-left:2px solid var(--stamp,var(--teal));padding-left:8px;}
  .env{font-size:11.5px;color:var(--f-soft);padding:12px 18px;border-top:1px solid var(--paper-line);}
  .env b{color:var(--f-ink);}
  .att{padding:10px 18px 14px;border-top:1px solid var(--paper-line);}
  .att .rl{font-weight:700;font-size:9.5px;color:var(--f-soft);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;}
  .achip{font-family:ui-monospace,"JetBrains Mono",monospace;font-size:10px;color:var(--f-soft);background:var(--paper-raised);border:1px solid var(--paper-line);border-radius:3px;padding:5px 8px;}
  .achip.ref{color:var(--stamp,var(--teal));border-color:var(--stamp,var(--teal));}
  .none{font-size:12px;color:var(--f-soft);font-style:italic;}

  /* actions */
  .review{font-size:12.5px;color:var(--ink-soft);margin:14px 0 10px;}
  .acts{display:flex;flex-wrap:wrap;gap:8px;}
  .btn{border:1px solid var(--paper-line);background:none;border-radius:100px;padding:10px 16px;font-size:12px;font-weight:700;cursor:pointer;}
  .btn.primary{background:var(--violet);border-color:var(--violet);color:#fff;}
  .btn:disabled{opacity:.35;cursor:not-allowed;}
  .hint{font-size:11.5px;color:var(--amber);margin-top:8px;}

  /* folded list (built) */
  .er-toggle{display:flex;align-items:center;gap:6px;background:none;border:none;padding:10px 0 6px;font-size:12px;font-weight:700;color:var(--ink-soft);cursor:pointer;}
  .er-warn{font-size:11.5px;color:var(--ink-soft);margin-bottom:6px;}
  .er-round{margin-bottom:14px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="mode" role="group" aria-label="Pattern">
    <button id="m-switch" aria-pressed="true">Switcher (proposed)</button>
    <button id="m-fold" aria-pressed="false">Folded list (built)</button>
  </div>
  <div class="mode-tag" id="tag"></div>
  <div class="slot" id="slot"></div>
</div>

<script>
  var ROUNDS = {
    1: {
      done: 'Localised the five onboarding screens.',
      evidence: 'Strings exported to a text file, one line per screen title and button.',
      env: 'Figma export, v3',
      files: ['onboarding-strings.txt'],
      fig: null,
      note: "Work wasn't submitted in Mandarin as required",
      when: 'Oct 11, 3:23 PM'
    },
    2: {
      done: 'Translated all strings to Simplified Chinese.',
      evidence: 'Every screen title, button and error message now reads in Mandarin.',
      env: 'Figma export, v3',
      files: [],
      fig: null,
      note: 'No attachments, poor submission',
      when: 'Oct 12, 2:47 PM'
    },
    3: {
      done: 'Translated all strings to Simplified Chinese and checked each one in context.',
      evidence: 'Screens 1 to 5 reviewed in the build. Screen 3 had a clipped button label, shortened to fit.',
      env: 'Pixel 7, Android 15, app v2.4.1',
      files: ['screen-3-zh.png', 'screens-1-5.mp4', 'strings-zh.json'],
      fig: 'Fig. 1: Screen 3 with the shortened button label',
      note: null,
      when: null
    }
  };
  var CURRENT = 3;
  var state = { mode: 'switch', sel: 3, open: false };

  function esc(t){ return String(t).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  function report(n, stamp, old){
    var r = ROUNDS[n];
    var files = r.files.length
      ? '<div class="att"><div class="rl">All attachments (' + r.files.length + ')</div><div class="chips">' +
        r.files.map(function(f, i){ return '<div class="achip' + (i === 0 && r.fig ? ' ref' : '') + '">' + (i === 0 && r.fig ? '\u2713 ' : '') + esc(f) + '</div>'; }).join('') +
        '</div></div>'
      : '<div class="att"><div class="rl">Attachments</div><div class="none">None attached in this round.</div></div>';
    var fig = r.fig
      ? '<div class="fig"><div class="fig-img">screen-3-zh.png</div><div class="fig-cap">' + esc(r.fig) + '</div></div>' : '';
    return '<div class="report' + (old ? ' old' : '') + '">' +
      '<div class="rh"><div class="cid">SUBMISSION</div><div class="stamp">' + esc(stamp) + '</div></div>' +
      '<div class="secs">' +
        '<div class="sec"><div class="sl">What was done</div><p>' + esc(r.done) + '</p></div><hr class="hr">' +
        '<div class="sec primary"><div class="sl">Evidence</div><p>' + esc(r.evidence) + '</p>' + fig + '</div>' +
      '</div>' +
      '<div class="env"><b>Environment</b> \u2014 ' + esc(r.env) + '</div>' + files + '</div>';
  }

  function note(n, label){
    var r = ROUNDS[n];
    if (!r.note) return '';
    return '<div class="fb"><b>' + label + ':</b> ' + esc(r.note) + '<span class="when">' + esc(r.when) + '</span></div>';
  }

  function header(){
    return '<div class="who"><div class="av">O</div><div><div class="n">@Olawalt</div><div class="s">Gold \u00b7 4.15\u2605</div></div><div class="chip">Submitted</div></div>';
  }

  function actions(disabled){
    return '<div class="review">Review by Oct 15, 3:24 PM (1d 19h left). After that the worker is paid automatically.</div>' +
      '<div class="acts">' +
        '<button class="btn" disabled>Request changes (0 left)</button>' +
        '<button class="btn"' + (disabled ? ' disabled' : '') + '>Offer release</button>' +
        '<button class="btn"' + (disabled ? ' disabled' : '') + '>Reject</button>' +
        '<button class="btn primary"' + (disabled ? ' disabled' : '') + '>Mark complete \u2014 release 1\u03c0</button>' +
      '</div>' +
      (disabled ? '<div class="hint">Actions apply to Round ' + CURRENT + '. Switch back to review it.</div>' : '');
  }

  function viewSwitch(){
    var s = state.sel, isOld = s !== CURRENT;
    var tabs = '<div class="tabs" role="tablist" aria-label="Submission rounds">' +
      [1, 2, 3].map(function(n){
        return '<button class="tab" role="tab" data-r="' + n + '" aria-selected="' + (n === s) + '">Round ' + n + (n === CURRENT ? '<span class="dot" title="Current"></span>' : '') + '</button>';
      }).join('') + '</div>';
    var warn = isOld
      ? '<div class="viewing"><span><b>Earlier round.</b> Not the current work.</span><button data-back>Back to Round ' + CURRENT + '</button></div>' : '';
    var fb = isOld ? note(s, 'Your note after this round') : '';
    return header() + tabs + warn + fb + report(s, isOld ? 'Round ' + s : 'Submitted', isOld) + actions(isOld);
  }

  function viewFold(){
    var earlier = [1, 2].map(function(n){
      return '<div class="er-round">' + report(n, 'Round ' + n, true) + note(n, 'Your note') + '</div>';
    }).join('');
    return header() + report(CURRENT, 'Submitted', false) +
      '<button class="er-toggle" data-fold aria-expanded="' + state.open + '">' + (state.open ? '\u25be' : '\u25b8') + ' Earlier rounds (2)</button>' +
      (state.open ? '<div class="er-warn">Read-only history. The current submission above replaced these rounds.</div>' + earlier : '') +
      actions(false);
  }

  function draw(){
    document.getElementById('slot').innerHTML = state.mode === 'switch' ? viewSwitch() : viewFold();
    document.getElementById('m-switch').setAttribute('aria-pressed', state.mode === 'switch');
    document.getElementById('m-fold').setAttribute('aria-pressed', state.mode === 'fold');
    document.getElementById('tag').textContent = state.mode === 'switch'
      ? 'Tap an older round to see the amber "not the current work" state and the disabled actions.'
      : 'What is live now. The current report stays on top; history is one tap away.';
  }

  document.getElementById('m-switch').onclick = function(){ state.mode = 'switch'; state.sel = CURRENT; draw(); };
  document.getElementById('m-fold').onclick = function(){ state.mode = 'fold'; state.open = false; draw(); };
  document.getElementById('slot').addEventListener('click', function(e){
    var t = e.target.closest('[data-r],[data-back],[data-fold]');
    if (!t) return;
    if (t.hasAttribute('data-r')) state.sel = Number(t.getAttribute('data-r'));
    else if (t.hasAttribute('data-back')) state.sel = CURRENT;
    else state.open = !state.open;
    draw();
  });
  draw();
</script>
</body>
</html>
