<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hivework — Job Detail (Alt: Tabbed + Ledger)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F7F5F1; --ink:#1B1A1F; --ink-soft:#6B6874;
    --violet:#6C5CE7; --violet-deep:#5643D9;
    --mint:#2EC4B6; --coral:#FF6B5D; --butter:#FFC857;
    --line:#E7E3DA; --card:#FFFFFF;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;background:#EAE7DF;color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:'Sora',sans-serif;}
  .mono{font-family:'JetBrains Mono',monospace;}
  svg{display:block;}

  .preview-bar{max-width:560px;margin:16px auto;padding:12px 20px;border:1px dashed #B8B2A0;border-radius:12px;background:#F1EEE5;font-size:11.5px;color:var(--ink-soft);}
  .preview-bar strong{color:var(--ink);}

  .frame{width:100%;max-width:560px;margin:0 auto;background:var(--cream);position:relative;min-height:80vh;border-radius:0 0 28px 28px;overflow:hidden;box-shadow:0 30px 60px -30px rgba(27,26,31,.3);}
  .screen{padding:0 24px 40px;}

  header{display:flex;align-items:center;justify-content:space-between;padding:24px 24px 4px;}
  .logo{font-family:'Sora';font-weight:800;font-size:17px;}
  .logo span{color:var(--violet);}
  .avatar-btn{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--violet),var(--violet-deep));color:white;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;}

  .back-btn{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--ink-soft);padding:20px 0 4px;cursor:pointer;background:none;border:none;}
  .detail-hero{padding:18px 0 4px;}
  .detail-cat{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--violet-deep);margin-bottom:8px;}
  .detail-title{font-family:'Sora';font-weight:800;font-size:24px;letter-spacing:-.5px;line-height:1.15;margin-bottom:14px;}
  .detail-meta-row{display:flex;gap:22px;margin-bottom:22px;}
  .detail-meta .l{font-size:10.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;}
  .detail-meta .v{font-family:'JetBrains Mono';font-weight:700;font-size:16px;margin-top:2px;}

  .slot-bar{display:flex;gap:4px;margin-bottom:10px;}
  .slot-seg{flex:1;height:8px;border-radius:5px;background:var(--line);}
  .slot-seg.completed{background:var(--mint);}
  .slot-seg.progress{background:var(--violet);}
  .slot-seg.submitted{background:var(--butter);}
  .slot-summary{font-size:12.5px;color:var(--ink-soft);margin-bottom:24px;}
  .slot-summary b{color:var(--ink);font-weight:700;}

  /* ===== Tab switcher — reusing the app's existing My Work / My Jobs
     toggle idiom, just repurposed as a content switcher for this screen ===== */
  .toggle-row{display:flex;gap:6px;background:#EFECE5;border-radius:100px;padding:5px;margin-bottom:20px;}
  .toggle-btn{flex:1;text-align:center;padding:10px 6px;border-radius:100px;font-size:12.5px;font-weight:700;color:var(--ink-soft);cursor:pointer;background:none;border:none;}
  .toggle-btn.active{background:var(--card);color:var(--ink);box-shadow:0 6px 16px -10px rgba(27,26,31,.25);}

  .tab-card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:0 20px 40px -22px rgba(27,26,31,.2);padding:22px 20px;margin-bottom:26px;}

  /* Overview */
  .ov-block{margin-bottom:22px;}
  .ov-block:last-child{margin-bottom:0;}
  .ov-label{font-size:11.5px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px;}
  .ov-block p{font-size:13.5px;color:var(--ink-soft);line-height:1.6;margin:0;}
  .req-list{list-style:none;padding:0;margin:0;}
  .req-list li{display:flex;gap:10px;font-size:13px;color:var(--ink);padding:9px 0;border-bottom:1px solid var(--line);align-items:flex-start;}
  .req-list li:last-child{border-bottom:none;}
  .req-list svg{flex-shrink:0;margin-top:2px;color:var(--mint);}
  .chip-row{display:flex;gap:8px;flex-wrap:wrap;}
  .chip-outline{border:1px solid var(--line);font-size:12px;font-weight:600;padding:6px 12px;border-radius:100px;color:var(--ink-soft);}

  /* Applicants */
  .applicant-row{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);}
  .applicant-row:last-child{border-bottom:none;}
  .avatar-sm{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--violet),var(--violet-deep));color:white;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .app-info{flex:1;min-width:0;}
  .app-info .n{font-weight:700;font-size:13.5px;}
  .app-info .s{font-size:11.5px;color:var(--ink-soft);}
  .app-actions{display:flex;gap:6px;flex-shrink:0;}
  .app-btn{padding:8px 13px;border-radius:100px;font-size:11.5px;font-weight:700;border:none;cursor:pointer;}
  .app-btn.approve{background:var(--violet);color:white;}
  .app-btn.decline{background:#EFECE5;color:var(--ink-soft);}
  .empty-note{font-size:12.5px;color:var(--ink-soft);padding:2px 0;}

  /* ===== Slots — reimagined as a route ledger (the app's withdrawal-
     ledger dashed line + dot idiom, extended into a worker "journey")  ===== */
  .ledger{position:relative;padding-left:0;}
  .ledger:before{content:"";position:absolute;left:19px;top:44px;bottom:14px;width:2px;background:var(--line);border-radius:2px;}
  .ledger-item{position:relative;padding:16px 0;border-bottom:1px solid var(--line);}
  .ledger-item:first-child{padding-top:0;}
  .ledger-item:last-child{padding-bottom:0;border-bottom:none;}
  .ledger-row{display:flex;align-items:center;gap:12px;}
  .ledger-dot{width:38px;height:38px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:white;font-weight:700;font-size:13px;position:relative;z-index:1;border:3px solid var(--cream);}
  .ledger-dot.completed{background:var(--mint);}
  .ledger-dot.progress{background:linear-gradient(135deg,var(--violet),var(--violet-deep));}
  .ledger-dot.submitted{background:var(--butter);color:#8A6512;}
  .ledger-info{flex:1;min-width:0;}
  .ledger-info .n{font-weight:700;font-size:13.5px;}
  .ledger-info .s{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
  .ledger-status{flex-shrink:0;font-size:10.5px;font-weight:700;padding:5px 11px;border-radius:100px;white-space:nowrap;}
  .ledger-status.completed{background:#E4F8F6;color:#1A9E92;}
  .ledger-status.progress{background:#EFEAFB;color:var(--violet-deep);}
  .ledger-status.submitted{background:#FFF3DC;color:#B8860B;}

  .rating-given{font-size:12px;color:var(--ink-soft);margin:14px 0 0 50px;}
  .rating-given .stars{color:var(--butter);letter-spacing:1px;}
  .rate-widget{margin:14px 0 0 50px;display:flex;align-items:center;gap:12px;}
  .rate-stars{display:flex;gap:4px;cursor:pointer;}
  .rate-stars svg{color:var(--line);}
  .rate-stars svg.on{color:var(--butter);}
  .rate-confirm{font-size:11.5px;font-weight:700;color:white;background:var(--violet);border:none;border-radius:100px;padding:7px 13px;cursor:pointer;opacity:.35;pointer-events:none;}
  .rate-confirm.enabled{opacity:1;pointer-events:auto;}
  .ledger-cta{margin:14px 0 0 50px;}
  .ledger-cta .app-btn{background:var(--violet);color:white;}

  .ledger-open{padding:14px 0;}
  .ledger-open .ledger-row{gap:12px;}
  .ledger-open .ledger-dot{background:var(--card);border:2px dashed var(--line);}
  .ledger-open .label{font-size:12.5px;color:var(--ink-soft);}

  .open-note{display:flex;gap:10px;background:#EFEAFB;border:1px solid #D9CFFB;border-radius:14px;padding:12px 14px;margin-top:18px;font-size:12.5px;color:var(--violet-deep);line-height:1.5;}
  .open-note svg{flex-shrink:0;margin-top:1px;}
</style>
</head>
<body>

<div class="preview-bar"><strong>Exploration</strong> — alternate structure for the same content: one tabbed card (Overview / Applicants / Slots) instead of three stacked cards, and Slots reimagined as a route ledger.</div>

<div class="frame">
  <header>
    <div class="logo">Hive<span>work</span></div>
    <div class="avatar-btn">O</div>
  </header>

  <div class="screen">
    <div class="back-btn" onclick="history.back()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M15 18l-6-6 6-6"/></svg>
      Back
    </div>

    <div class="detail-hero">
      <div class="detail-cat">Bug testing</div>
      <div class="detail-title">Test payment flow on Android</div>
    </div>

    <div class="detail-meta-row">
      <div class="detail-meta"><div class="l">Budget</div><div class="v mono">10π</div></div>
      <div class="detail-meta"><div class="l">Per slot</div><div class="v mono">2π</div></div>
      <div class="detail-meta"><div class="l">Posted</div><div class="v">2 days ago</div></div>
    </div>

    <div class="slot-bar" id="slot-bar"></div>
    <div class="slot-summary" id="slot-summary"></div>

    <div class="toggle-row">
      <button class="toggle-btn" id="tab-overview" onclick="setTab('overview')">Overview</button>
      <button class="toggle-btn" id="tab-applicants" onclick="setTab('applicants')">Applicants (<span id="tab-app-count">2</span>)</button>
      <button class="toggle-btn" id="tab-slots" onclick="setTab('slots')">Slots</button>
    </div>

    <div id="tab-content"></div>
    <div class="open-note" id="open-note" style="display:none;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
      <span id="open-note-text"></span>
    </div>
  </div>
</div>

<script>
const STAR = '<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>';
const TOTAL_SLOTS = 5;
let activeTab = 'overview';

let applicants = [
  { id: 'a1', name: '@sam_k', rating: '4.8★', jobs: '31 jobs done' },
  { id: 'a2', name: '@devMia', rating: '4.5★', jobs: '12 jobs done' },
];
let slots = [
  { id: 's1', name: '@walterdanny00', rating: '4.6★', jobs: '42 jobs done', status: 'completed', givenRating: 5, draftRating: 0 },
  { id: 's2', name: '@ola_t', rating: '4.9★', jobs: '18 jobs done', status: 'completed', givenRating: null, draftRating: 0 },
  { id: 's3', name: '@kwame_b', rating: '4.2★', jobs: '9 jobs done', status: 'progress', givenRating: null, draftRating: 0 },
  { id: 's4', name: '@leah_r', rating: '4.7★', jobs: '20 jobs done', status: 'submitted', givenRating: null, draftRating: 0 },
];
const STATUS_LABEL = { completed: 'Completed', progress: 'In progress', submitted: 'Submitted' };

function setTab(t) { activeTab = t; render(); }

function renderOverview() {
  return `
    <div class="tab-card">
      <div class="ov-block">
        <div class="ov-label">Description</div>
        <p>Test the payment flow end to end on Android and report anything that breaks, including screenshots and exact repro steps. Five testers needed across different device/OS combinations.</p>
      </div>
      <div class="ov-block">
        <div class="ov-label">Requirements</div>
        <ul class="req-list">
          <li>${'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>'}Test on a real Android device, not an emulator</li>
          <li>${'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>'}Submit a structured report with screenshots</li>
          <li>${'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>'}Complete within 48 hours of approval</li>
        </ul>
      </div>
      <div class="ov-block">
        <div class="ov-label">Device & language</div>
        <div class="chip-row">
          <span class="chip-outline">Android</span>
          <span class="chip-outline">English</span>
        </div>
      </div>
    </div>
  `;
}

function renderApplicants() {
  const rows = applicants.map(a => `
    <div class="applicant-row">
      <div class="avatar-sm">${a.name[1].toUpperCase()}</div>
      <div class="app-info"><div class="n">${a.name}</div><div class="s">${a.rating} · ${a.jobs}</div></div>
      <div class="app-actions">
        <button class="app-btn approve" onclick="approve('${a.id}')">Approve</button>
        <button class="app-btn decline" onclick="decline('${a.id}')">Decline</button>
      </div>
    </div>
  `).join('') || `<p class="empty-note">No pending applicants.</p>`;
  return `<div class="tab-card">${rows}</div>`;
}

function renderSlots() {
  const items = slots.map(s => {
    let extra = '';
    if (s.status === 'completed' && s.givenRating) {
      extra = `<div class="rating-given"><span class="stars">${'★'.repeat(s.givenRating)}${'☆'.repeat(5 - s.givenRating)}</span> You rated this worker</div>`;
    } else if (s.status === 'completed' && !s.givenRating) {
      const stars = [1,2,3,4,5].map(n =>
        `<span onclick="setDraftRating('${s.id}',${n})">${STAR.replace('<svg', `<svg class="${n <= s.draftRating ? 'on' : ''}"`)}</span>`
      ).join('');
      extra = `<div class="rate-widget"><div class="rate-stars">${stars}</div><button class="rate-confirm${s.draftRating ? ' enabled' : ''}" onclick="confirmRating('${s.id}')">Confirm rating</button></div>`;
    } else if (s.status === 'submitted') {
      extra = `<div class="ledger-cta"><button class="app-btn" onclick="markComplete('${s.id}')">Mark reviewed & complete</button></div>`;
    }
    return `
      <div class="ledger-item">
        <div class="ledger-row">
          <div class="ledger-dot ${s.status}">${s.name[1].toUpperCase()}</div>
          <div class="ledger-info">
            <div class="n">${s.name}</div>
            <div class="s">${s.rating} · ${s.jobs}</div>
          </div>
          <div class="ledger-status ${s.status}">${STATUS_LABEL[s.status]}</div>
        </div>
        ${extra}
      </div>
    `;
  }).join('');

  const openCount = TOTAL_SLOTS - slots.length;
  let openItem = '';
  for (let i = 0; i < openCount; i++) {
    openItem += `<div class="ledger-item ledger-open"><div class="ledger-row"><div class="ledger-dot"></div><div class="label">Open slot — awaiting an applicant</div></div></div>`;
  }
  return `<div class="tab-card"><div class="ledger">${items}${openItem}</div></div>`;
}

function render() {
  document.getElementById('tab-overview').classList.toggle('active', activeTab === 'overview');
  document.getElementById('tab-applicants').classList.toggle('active', activeTab === 'applicants');
  document.getElementById('tab-slots').classList.toggle('active', activeTab === 'slots');
  document.getElementById('tab-app-count').textContent = applicants.length;

  const content = document.getElementById('tab-content');
  content.innerHTML = activeTab === 'overview' ? renderOverview() : activeTab === 'applicants' ? renderApplicants() : renderSlots();

  const bar = document.getElementById('slot-bar');
  bar.innerHTML = '';
  for (let i = 0; i < TOTAL_SLOTS; i++) {
    const slot = slots[i];
    const seg = document.createElement('div');
    seg.className = 'slot-seg' + (slot ? ' ' + slot.status : '');
    bar.appendChild(seg);
  }
  const counts = { completed: 0, progress: 0, submitted: 0 };
  slots.forEach(s => counts[s.status]++);
  const parts = [];
  if (counts.completed) parts.push(`${counts.completed} completed`);
  if (counts.progress) parts.push(`${counts.progress} in progress`);
  if (counts.submitted) parts.push(`${counts.submitted} awaiting review`);
  document.getElementById('slot-summary').innerHTML = `<b>${slots.length} of ${TOTAL_SLOTS} slots filled</b>${parts.length ? ' — ' + parts.join(', ') : ''}`;

  const noteEl = document.getElementById('open-note');
  if (openCountNow() > 0) {
    noteEl.style.display = 'flex';
    document.getElementById('open-note-text').textContent = `${openCountNow()} slot${openCountNow() > 1 ? 's' : ''} still open — approving an applicant fills one.`;
  } else {
    noteEl.style.display = 'none';
  }
}
function openCountNow(){ return TOTAL_SLOTS - slots.length; }

function approve(id) {
  const a = applicants.find(x => x.id === id);
  applicants = applicants.filter(x => x.id !== id);
  slots.push({ id: 'slot-' + id, name: a.name, rating: a.rating, jobs: a.jobs, status: 'progress', givenRating: null, draftRating: 0 });
  render();
}
function decline(id) { applicants = applicants.filter(x => x.id !== id); render(); }
function setDraftRating(id, n) { slots = slots.map(s => s.id === id ? { ...s, draftRating: n } : s); render(); }
function confirmRating(id) { slots = slots.map(s => s.id === id && s.draftRating ? { ...s, givenRating: s.draftRating } : s); render(); }
function markComplete(id) { slots = slots.map(s => s.id === id ? { ...s, status: 'completed' } : s); render(); }

render();
</script>
</body>
</html>
